<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Bookings</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            background: #f4f4f4;
        }

        .top {
            height: 125px;
            background: rgb(23,35,51);
            color: white;
            position: relative;
        }

        .logo {
            position: absolute;
            left: 40px;
            top: 45px;
            font-size: 28px;
            font-weight: bold;
        }

        .user {
            position: absolute;
            right: 50px;
            top: 35px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            z-index: 999;
        }

        .logout-link {
            color: white;
            text-decoration: underline;
            cursor: pointer;
            position: relative;
            z-index: 1000;
        }

        .main {
            padding: 40px;
        }

        .title {
            width: 320px;
            height: 70px;
            background: #8ec9f5;
            border: 4px solid #1e293b;
            text-align: center;
            line-height: 70px;
            font-size: 32px;
            font-weight: bold;
            margin: -40px auto 30px auto;
        }

        .actions {
            width: 95%;
            margin: 0 auto 15px auto;
            text-align: left;
        }

        .edit-btn {
            background: orange;
            color: white;
            border: none;
            padding: 7px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-right: 8px;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 7px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 3px 3px 8px gray;
        }

        th {
            background: #8ec9f5;
            border: 2px solid #1e293b;
            padding: 10px;
        }

        td {
            border: 2px solid #1e293b;
            padding: 8px;
            text-align: center;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 20px auto;
            text-align: center;
            font-size: 20px;
            text-decoration: none;
            font-weight: bold;
            color: #1e293b;
            position: relative;
            z-index: 999;
        }
    </style>
</head>

<body>

<div class="top">
    <div class="logo">Hotel De Soleil</div>

    <div class="user">
        👤 <span th:text="${username}">Admin</span><br>
        <a class="logout-link" th:href="@{/logout}">Log Out</a>
    </div>
</div>

<div class="main">
    <div class="title">All Bookings</div>

    <div class="actions">
        <button type="button" class="edit-btn" onclick="editBooking()">Edit</button>

        <form id="deleteForm" th:action="@{/cancel-booking}" method="post" style="display:inline;">
            <input type="hidden" name="id" id="deleteId">
            <button type="button" class="delete-btn" onclick="deleteBooking()">Delete</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>#</th>
                <th>User</th>
                <th>Name</th>
                <th>Room Type</th>
                <th>Capacity</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Room ID</th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="9">No bookings found.</td>
            </tr>

            <tr th:each="b, iter : ${bookings}">
                <td>
                    <input type="radio" name="selectedBooking" th:value="${b.id}">
                </td>

                <td th:text="${iter.count}"></td>
                <td th:text="${b.username}"></td>
                <td th:text="${b.name}"></td>
                <td th:text="${b.roomType}"></td>
                <td th:text="${b.roomCapacity}"></td>
                <td th:text="${b.checkIn}"></td>
                <td th:text="${b.checkOut}"></td>
                <td th:text="${b.roomId}"></td>
            </tr>
        </tbody>
    </table>

    <a class="back" th:href="@{/admin-dashboard}">‹ Back</a>
</div>

<script>
function getSelectedBookingId() {
    let selected = document.querySelector('input[name="selectedBooking"]:checked');
    return selected ? selected.value : null;
}

function editBooking() {
    let id = getSelectedBookingId();

    if (!id) {
        alert("Select a booking first.");
        return;
    }

    window.location.href = "/edit-booking?id=" + id;
}

function deleteBooking() {
    let id = getSelectedBookingId();

    if (!id) {
        alert("Select a booking first.");
        return;
    }

    if (confirm("Delete this booking?")) {
        document.getElementById("deleteId").value = id;
        document.getElementById("deleteForm").submit();
    }
}
</script>

</body>
</html>
