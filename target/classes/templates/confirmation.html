<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirmation Data</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
        }

        .top {
            height: 125px;
            background: rgb(23, 35, 51);
            color: white;
            position: relative;
        }

        .logo {
            position: absolute;
            left: 40px;
            top: 45px;
            font-size: 28px;
            font-weight: bold;
        }

        .main {
            padding: 20px;
        }

        .title {
            width: 330px;
            height: 70px;
            background: #8ec9f5;
            border: 4px solid #1e293b;
            box-shadow: 3px 3px 5px gray;
            text-align: center;
            line-height: 70px;
            font-size: 34px;
            font-weight: bold;
            font-style: italic;
            margin: -35px auto 30px auto;
        }

        .content {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        fieldset {
            border: 4px solid #1e293b;
            background: white;
            width: 380px;
        }

        legend {
            border: 4px solid #1e293b;
            background: white;
            padding: 5px 30px;
            font-weight: bold;
            text-align: center;
        }

        .row {
            display: flex;
            margin: 15px;
            font-size: 16px;
        }

        .label {
            width: 160px;
            font-weight: bold;
        }

        .value {
            flex: 1;
            background: #f1f1f1;
            padding: 6px;
            min-height: 20px;
            word-break: break-word;
        }

        .buttons {
            text-align: center;
            margin: 25px auto;
        }

        .cancel, .save {
            width: 100px;
            height: 45px;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel {
            background: gray;
            margin-right: 10px;
        }

        .save {
            background: green;
        }
    </style>
</head>

<body>

<div class="top">
    <div class="logo">HOTEL DE SOLEIL</div>
</div>

<div class="main">
    <div class="title">Confirmation</div>

    <div class="content">

        <fieldset>
            <legend>Personal Data</legend>

            <div class="row"><div class="label">Name</div><div class="value" th:text="${name}"></div></div>
            <div class="row"><div class="label">Phone</div><div class="value" th:text="${phone}"></div></div>
            <div class="row"><div class="label">Email</div><div class="value" th:text="${email}"></div></div>
            <div class="row"><div class="label">Address</div><div class="value" th:text="${address}"></div></div>
            <div class="row"><div class="label">City</div><div class="value" th:text="${city}"></div></div>
            <div class="row"><div class="label">Nationality</div><div class="value" th:text="${nationality}"></div></div>
            <div class="row"><div class="label">Passport No</div><div class="value" th:text="${passportNo}"></div></div>

            <div class="row"><div class="label">Card Number</div><div class="value" th:text="${cardNumber}"></div></div>
            <div class="row"><div class="label">CVC Code</div><div class="value" th:text="${cvcCode}"></div></div>
        </fieldset>

        <div>
            <fieldset>
                <legend>Room Data</legend>

                <div class="row"><div class="label">Room Type</div><div class="value" th:text="${roomType}"></div></div>
                <div class="row"><div class="label">Room Capacity</div><div class="value" th:text="${roomCapacity}"></div></div>
                <div class="row"><div class="label">Check-in Date</div><div class="value" th:text="${checkInDate}"></div></div>
                <div class="row"><div class="label">Check-out Date</div><div class="value" th:text="${checkOutDate}"></div></div>
                <div class="row"><div class="label">Room ID</div><div class="value" th:text="${roomId}"></div></div>
            </fieldset>

            <br>

            <fieldset>
                <legend>Payment Summary</legend>

                <div class="row"><div class="label">Number of Nights</div><div class="value" th:text="${nights}"></div></div>
                <div class="row"><div class="label">Night Cost</div><div class="value" th:text="${nightCost}"></div></div>
                <div class="row"><div class="label">Total Price</div><div class="value" th:text="${totalPrice}"></div></div>
            </fieldset>
        </div>
    </div>

    <div class="buttons">
        <a th:href="@{/book-room}">
            <button class="cancel" type="button">Cancel</button>
        </a>

        <form th:action="@{/save-booking}" method="post" style="display:inline;">
            <button class="save" type="submit">Save</button>
        </form>
    </div>
</div>

</body>
</html>
