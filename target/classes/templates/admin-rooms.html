<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rooms</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
        }

        .top {
            height: 125px;
            background: rgb(23, 35, 51);
            color: white;
            position: relative;
        }

        .logo {
            position: absolute;
            left: 40px;
            top: 45px;
            font-size: 28px;
            font-weight: bold;
        }

        .user {
            position: absolute;
            right: 50px;
            top: 35px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .user a {
            color: white;
        }

        .main {
            padding: 40px;
        }

        .title {
            width: 300px;
            height: 70px;
            background: #8ec9f5;
            border: 4px solid #1e293b;
            box-shadow: 3px 3px 5px gray;
            text-align: center;
            line-height: 70px;
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
            margin: -35px auto 25px auto;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 3px 3px 8px gray;
        }

        th {
            background: #8ec9f5;
            padding: 10px;
            border: 2px solid #1e293b;
            font-weight: bold;
        }

        td {
            padding: 8px;
            border: 2px solid #1e293b;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f7f7f7;
        }

        .edit-btn {
            background: orange;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .back {
            display: block;
            margin: 25px auto;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="top">
    <div class="logo">PLAZA HOTEL</div>

    <div class="user">
        👤 <span th:text="${username}">Admin</span><br>
        <a th:href="@{/login}">Log Out</a>
    </div>
</div>

<div class="main">
    <div class="title">Rooms</div>

    <table>
        <tr>
            <th>ID</th>
            <th>Room Type</th>
            <th>Room Capacity</th>
            <th>Check-in Date</th>
            <th>Check-out Date</th>
            <th>Available?</th>
            <th>Action</th>
        </tr>

        <tr th:each="r : ${rooms}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.roomType}"></td>
            <td th:text="${r.roomCapacity}"></td>
            <td th:text="${r.checkInDate}"></td>
            <td th:text="${r.checkOutDate}"></td>
            <td th:text="${r.available}"></td>

            <td>
                <a th:href="@{/edit-room(id=${r.id})}">
                    <button class="edit-btn">Edit</button>
                </a>

                <form th:action="@{/delete-room}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${r.id}">
                    <button type="submit" class="delete-btn"
                            onclick="return confirm('Delete this room from database?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
    </table>

    <a class="back" th:href="@{/admin-dashboard}">‹ Back</a>
</div>

</body>
</html>
