<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Booking</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
        }

        .top {
            height: 125px;
            background: rgb(23, 35, 51);
            color: white;
            position: relative;
        }

        .logo {
            position: absolute;
            left: 40px;
            top: 45px;
            font-size: 28px;
            font-weight: bold;
        }

        .user {
            position: absolute;
            right: 50px;
            top: 35px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            z-index: 999;
        }

        .logout-link {
            color: white;
            text-decoration: underline;
            cursor: pointer;
        }

        .main {
            padding: 50px;
        }

        .title {
            width: 300px;
            height: 70px;
            background: #8ec9f5;
            border: 4px solid #1e293b;
            box-shadow: 3px 3px 5px gray;
            text-align: center;
            line-height: 70px;
            font-size: 34px;
            font-weight: bold;
            font-style: italic;
            margin: -20px auto 35px auto;
        }

        .actions {
            width: 90%;
            margin: 10px auto;
            text-align: left;
        }

        .cancel-btn {
            background: red;
            color: white;
            border: none;
            padding: 8px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 3px 3px 8px gray;
        }

        th {
            background: #8ec9f5;
            border: 2px solid #1e293b;
            padding: 12px;
        }

        td {
            border: 2px solid #1e293b;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f7f7f7;
        }

        .back {
    display: block;
    width: fit-content;
    margin: 25px auto;
    text-align: center;
    color: #1e293b;
    font-size: 20px;
    text-decoration: none;
    font-weight: bold;
    position: relative;
    z-index: 9999;
    cursor: pointer;
}
    </style>
</head>

<body>

<div class="top">
    <div class="logo">HOTEL DE SOLEIL</div>

    <div class="user">
        👤 <span th:text="${username}">User</span><br>
        <a class="logout-link" th:href="@{/logout}">Log Out</a>
    </div>
</div>

<div class="main">
    <div class="title">My Booking</div>

    <!-- ACTION BUTTON ABOVE -->
    <div class="actions">
        <form id="cancelForm" th:action="@{/cancel-booking}" method="post" style="display:inline;">
            <input type="hidden" name="id" id="cancelId">
            <button type="button" onclick="cancelBooking()" class="cancel-btn">
                Cancel Booking
            </button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>#</th>
                <th>Room Type</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Room ID</th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="6">No bookings found.</td>
            </tr>

            <tr th:each="b, iter : ${bookings}">
                <td>
                    <input type="radio" name="selectedBooking" th:value="${b.id}">
                </td>

                <td th:text="${iter.count}"></td>
                <td th:text="${b.roomType}"></td>
                <td th:text="${b.checkIn}"></td>
                <td th:text="${b.checkOut}"></td>
                <td th:text="${b.roomId}"></td>
            </tr>
        </tbody>
    </table>

    <a class="back" th:href="@{/user-dashboard}">‹ Back</a>
</div>

<script>
function getSelectedId() {
    let selected = document.querySelector('input[name="selectedBooking"]:checked');
    return selected ? selected.value : null;
}

function cancelBooking() {
    let id = getSelectedId();

    if (!id) {
        alert("Select a booking first.");
        return;
    }

    if (confirm("Cancel this booking?")) {
        document.getElementById("cancelId").value = id;
        document.getElementById("cancelForm").submit();
    }
}
</script>

</body>
</html>
