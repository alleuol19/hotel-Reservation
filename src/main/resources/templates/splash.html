<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Plaza Hotel</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .hero {
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                              url("/images/splash-bg.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
        }

        .nav {
            position: absolute;
            top: 40px;
            right: 70px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 35px;
            font-size: 20px;
        }

        .center-text {
            position: absolute;
            top: 28%;
            width: 100%;
            text-align: center;
        }

        .welcome {
            font-size: 70px;
            font-family: Georgia, serif;
            font-weight: bold;
        }

        .luxury {
            font-size: 70px;
            font-family: Georgia, serif;
            color: #d4b36a;
            margin-top: 15px;
        }

        .hotel-name {
            position: absolute;
            left: 80px;
            bottom: 170px;
            font-size: 38px;
            font-family: Georgia, serif;
            letter-spacing: 3px;
            color: #d8c9a2;
        }

        .btn {
            position: absolute;
            left: 50%;
            bottom: 150px;
            transform: translateX(-50%);
            background: rgba(4, 42, 87, 0.9);
            color: white;
            padding: 25px 60px;
            text-decoration: none;
            font-size: 28px;
            font-family: Georgia, serif;
            font-weight: bold;
        }

        .btn:hover {
            background: #123f75;
        }
    </style>
</head>

<body>

<div class="hero">

    <div class="nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/login}">Rooms & Suites</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
    </div>

    <div class="center-text">
        <div class="welcome">WELCOME TO</div>
        <div class="luxury">Pure Luxury & Comfort</div>
    </div>

    <a class="btn" th:href="@{/login}">LOG IN</a>

</div>

</body>
</html>
