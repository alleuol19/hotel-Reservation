<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rooms</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
        }

        .top {
            height: 125px;
            background: rgb(23, 35, 51);
            color: white;
            position: relative;
        }

        .logo {
            position: absolute;
            left: 40px;
            top: 45px;
            font-size: 28px;
            font-weight: bold;
        }

        .user {
            position: absolute;
            right: 50px;
            top: 35px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            z-index: 999;
        }

        .logout-link {
            color: white;
            text-decoration: underline;
            cursor: pointer;
            position: relative;
            z-index: 1000;
        }

        .main {
            padding: 40px;
        }

        .title {
            width: 300px;
            height: 70px;
            background: #8ec9f5;
            border: 4px solid #1e293b;
            box-shadow: 3px 3px 5px gray;
            text-align: center;
            line-height: 70px;
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
            margin: -35px auto 25px auto;
        }

        .search-box {
            width: 95%;
            margin: 0 auto 20px auto;
            text-align: right;
        }

        .search-box input {
            width: 280px;
            height: 35px;
            padding-left: 10px;
            border: 2px solid #1e293b;
            font-size: 14px;
        }
        
        .actions {
    width: 95%;
    margin: 10px auto;
    text-align: left;
}

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 3px 3px 8px gray;
        }

        th {
            background: #8ec9f5;
            padding: 10px;
            border: 2px solid #1e293b;
            font-weight: bold;
        }

        td {
            padding: 8px;
            border: 2px solid #1e293b;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f7f7f7;
        }

        .edit-btn {
            background: orange;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .back {
    display: block;
    width: fit-content;
    margin: 25px auto;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #1e293b;
    text-decoration: none;
    position: relative;
    z-index: 999;
    cursor: pointer;
}
    </style>
</head>

<body>

<div class="top">
    <div class="logo">PLAZA HOTEL</div>

    <div class="user">
        👤 <span th:text="${username}">Admin</span><br>
        <a class="logout-link" th:href="@{/login}">Log Out</a>
    </div>
</div>

<div class="main">
    <div class="title">Rooms</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search room..." onkeyup="searchTable()">
    </div>
    
    
    <div class="actions">
    <button onclick="editRoom()" class="edit-btn">Edit</button>

    <form id="deleteForm" th:action="@{/delete-room}" method="post" style="display:inline;">
        <input type="hidden" name="id" id="deleteId">
        <button type="button" onclick="deleteRoom()" class="delete-btn">Delete</button>
    </form>
</div>

    <table>
        <thead>
            <tr>
            <th>Select</th>
                <th>#</th>
                <th>Room Type</th>
                <th>Room Capacity</th>
                <th>Check-in Date</th>
                <th>Check-out Date</th>
                <th>Available?</th>
            </tr>
        </thead>

        <tbody>
    <tr th:if="${#lists.isEmpty(rooms)}">
        <td colspan="7">No rooms found.</td>
    </tr>

    <tr th:each="r, iter : ${rooms}">
    <td>
        <input type="radio" name="selectedRoom" th:value="${r.id}">
    </td>
    <td th:text="${iter.count}"></td>
    <td th:text="${r.roomType}"></td>
    <td th:text="${r.roomCapacity}"></td>
    <td th:text="${r.checkInDate}"></td>
    <td th:text="${r.checkOutDate}"></td>
    <td th:text="${r.available}"></td>
</tr>
</tbody>
    </table>

    <a class="back" th:href="@{/admin-dashboard}">‹ Back</a>
</div>

<script>
function searchTable() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let rows = document.querySelectorAll("tbody tr");

    rows.forEach(row => {
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
    });
    
}

function getSelectedId() {
    let selected = document.querySelector('input[name="selectedRoom"]:checked');
    return selected ? selected.value : null;
}

function editRoom() {
    let id = getSelectedId();

    if (!id) {
        alert("Select a room first.");
        return;
    }

    window.location.href = "/edit-room?id=" + id;
}

function deleteRoom() {
    let id = getSelectedId();

    if (!id) {
        alert("Select a room first.");
        return;
    }

    if (confirm("Delete this room?")) {
        document.getElementById("deleteId").value = id;
        document.getElementById("deleteForm").submit();
    }
}

</script>

</body>
</html>
