<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact Us - Hotel De Soleil</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"Segoe UI", Arial, sans-serif;
            background:#f5f5f5;
            color:#222;
        }

        .navbar{
            width:100%;
            height:85px;
            background:rgba(15,25,40,0.92);
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 70px;
        }

        .logo{
            color:white;
            font-size:34px;
            font-weight:bold;
            letter-spacing:1px;
        }
        .navbar-logo{
    height:65px;
    width:auto;
    object-fit:contain;
}

        .nav-links a{
            color:white;
            text-decoration:none;
            margin-left:35px;
            font-size:18px;
        }

        .nav-links a:hover{
            color:#d4b36a;
        }

        .contact-banner{
            background:#101820;
            color:white;
            text-align:center;
            padding:50px 20px 130px;
            clip-path:polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
        }

        .contact-banner h1{
            font-size:58px;
            font-weight:bold;
            margin-bottom:20px;
        }

        .contact-banner h2{
            font-size:30px;
            color:#d4b36a;
        }

        .form-container{
            max-width:670px;
            margin:45px auto 80px;
            padding:0 20px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:8px;
            font-size:14px;
        }

        .required{
            color:#c0392b;
            font-size:12px;
            font-style:italic;
        }

        .name-row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        input, textarea{
            width:100%;
            padding:14px;
            border:none;
            border-radius:5px;
            margin-bottom:20px;
            font-size:15px;
            outline:none;
        }

        input:focus, textarea:focus{
            border:2px solid #d4b36a;
        }

        textarea{
            height:175px;
            resize:none;
        }

        .counter{
            color:gray;
            font-size:13px;
            margin-top:-8px;
            margin-bottom:25px;
        }

        .send-btn{
            background:#d4b36a;
            color:white;
            border:none;
            padding:14px 38px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .send-btn:hover{
            background:#b7964c;
        }
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">

        <img src="/images/logo.png" class="navbar-logo">

    </div>

    <div class="nav-links">

        <a th:href="@{/}">Home</a>
        <a th:href="@{/#about}">About</a>
        <a th:href="@{/#rooms}">Rooms</a>
        <a th:href="@{/#gallery}">Gallery</a>
        <a th:href="@{/#contact}">Contact</a>

    </div>

</div>

<section class="contact-banner">
    <h1>Do you have any questions?</h1>
    <h2>Contact us 🙂</h2>
</section>

<div class="form-container">

    <form th:action="@{/send-contact}" method="post">

        <label>
            Name <span class="required">(Required)</span>
        </label>

        <div class="name-row">
            <input type="text" name="firstName" placeholder="First name" required>
            <input type="text" name="lastName" placeholder="Last name" required>
        </div>

        <label>
            E-mail <span class="required">(Required)</span>
        </label>

        <input type="email" name="email" required>

        <label>
            Ask us anything <span class="required">(Required)</span>
        </label>

        <textarea name="message" maxlength="600" required></textarea>

        <div class="counter">0 of 600 max characters</div>

        <button type="submit" class="send-btn">Send</button>

    </form>

</div>

</body>
</html>
