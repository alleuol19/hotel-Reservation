<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Guests</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
        }

        .top {
            height: 125px;
            background: rgb(23, 35, 51);
            color: white;
            position: relative;
        }

        .logo {
            position: absolute;
            left: 40px;
            top: 45px;
            font-size: 28px;
            font-weight: bold;
        }

        .main {
            padding: 40px;
        }

        .title {
            width: 360px;
            height: 70px;
            background: #8ec9f5;
            border: 4px solid #1e293b;
            text-align: center;
            line-height: 70px;
            font-size: 30px;
            font-weight: bold;
            margin: -40px auto 30px auto;
        }

        .actions {
            width: 95%;
            margin: 0 auto 15px auto;
            text-align: left;
        }

        .edit-btn {
            background: orange;
            color: white;
            border: none;
            padding: 7px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-right: 8px;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 7px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 3px 3px 8px gray;
        }

        th {
            background: #8ec9f5;
            border: 2px solid #1e293b;
            padding: 10px;
        }

        td {
            border: 2px solid #1e293b;
            padding: 8px;
            text-align: center;
        }

        .back {
    display: block;
    width: fit-content;
    margin: 20px auto;
    text-align: center;
    font-size: 20px;
    text-decoration: none;
    font-weight: bold;
    color: #1e293b;
    position: relative;
    z-index: 9999;
    cursor: pointer;
}
    </style>
</head>

<body>

<div class="top">
    <div class="logo">PLAZA HOTEL</div>
</div>

<div class="main">
    <div class="title">Guests Who Booked</div>

    <div class="actions">
        <button type="button" class="edit-btn" onclick="editGuest()">Edit</button>

        <form id="deleteForm" th:action="@{/delete-guest}" method="post" style="display:inline;">
            <input type="hidden" name="id" id="deleteId">
            <button type="button" class="delete-btn" onclick="deleteGuest()">Delete</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>#</th>
                <th>Username</th>
                <th>Guest Name</th>
                <th>Phone</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${#lists.isEmpty(guests)}">
                <td colspan="6">No guests found.</td>
            </tr>

            <tr th:each="g, iter : ${guests}">
                <td>
                    <input type="radio" name="selectedGuest" th:value="${g.id}">
                </td>
                <td th:text="${iter.count}"></td>
                <td th:text="${g.username}"></td>
                <td th:text="${g.name}"></td>
                <td th:text="${g.phone}"></td>
                <td th:text="${g.email}"></td>
            </tr>
        </tbody>
    </table>

    <a class="back" th:href="@{/admin-dashboard}">‹ Back</a>
</div>

<script>
function getSelectedGuestId() {
    let selected = document.querySelector('input[name="selectedGuest"]:checked');
    return selected ? selected.value : null;
}

function editGuest() {
    let id = getSelectedGuestId();

    if (!id) {
        alert("Select a guest first.");
        return;
    }

    window.location.href = "/edit-guest?id=" + id;
}

function deleteGuest() {
    let id = getSelectedGuestId();

    if (!id) {
        alert("Select a guest first.");
        return;
    }

    if (confirm("Delete this guest booking?")) {
        document.getElementById("deleteId").value = id;
        document.getElementById("deleteForm").submit();
    }
}
</script>

</body>
</html>
