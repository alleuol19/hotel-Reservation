<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Feedback</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
        }

        .top {
            height: 125px;
            background: rgb(23, 35, 51);
            color: white;
            position: relative;
        }

        .logo {
            position: absolute;
            left: 40px;
            top: 45px;
            font-size: 28px;
            font-weight: bold;
        }

        .main {
            padding: 40px;
        }

        .title {
            width: 360px;
            height: 70px;
            background: #8ec9f5;
            border: 4px solid #1e293b;
            box-shadow: 3px 3px 5px gray;
            text-align: center;
            line-height: 70px;
            font-size: 32px;
            font-weight: bold;
            font-style: italic;
            margin: -35px auto 30px auto;
        }

        .actions {
            width: 95%;
            margin: 0 auto 15px auto;
            text-align: left;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 7px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 3px 3px 8px gray;
            table-layout: fixed;
        }

        th {
            background: #8ec9f5;
            border: 2px solid #1e293b;
            padding: 12px;
            font-size: 16px;
        }

        td {
            border: 2px solid #1e293b;
            padding: 10px;
            text-align: center;
            font-size: 15px;
        }

        .select-col { width: 8%; }
        .num-col { width: 7%; }
        .username-col { width: 15%; }
        .name-col { width: 15%; }
        .rating-col { width: 10%; }
        .message-col { width: 45%; }

        .message {
            text-align: left;
            word-wrap: break-word;
            white-space: normal;
        }

        tr:nth-child(even) {
            background: #f7f7f7;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 25px auto;
            text-align: center;
            color: #1e293b;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            position: relative;
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="top">
    <div class="logo">PLAZA HOTEL</div>
</div>

<div class="main">
    <div class="title">User Feedback</div>

    <div class="actions">
        <form id="deleteForm" th:action="@{/delete-feedback}" method="post" style="display:inline;">
            <input type="hidden" name="id" id="deleteId">
            <button type="button" class="delete-btn" onclick="deleteFeedback()">Delete</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th class="select-col">Select</th>
                <th class="num-col">#</th>
                <th class="username-col">Username</th>
                <th class="name-col">Name</th>
                <th class="rating-col">Rating</th>
                <th class="message-col">Message</th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${#lists.isEmpty(feedbacks)}">
                <td colspan="6">No feedback found.</td>
            </tr>

            <tr th:each="f, iter : ${feedbacks}">
                <td>
                    <input type="radio" name="selectedFeedback" th:value="${f.id}">
                </td>
                <td th:text="${iter.count}"></td>
                <td th:text="${f.username}"></td>
                <td th:text="${f.name}"></td>
                <td th:text="${f.rating}"></td>
                <td class="message" th:text="${f.message}"></td>
            </tr>
        </tbody>
    </table>

    <a class="back" th:href="@{/admin-dashboard}">‹ Back</a>
</div>

<script>
function getSelectedFeedbackId() {
    let selected = document.querySelector('input[name="selectedFeedback"]:checked');
    return selected ? selected.value : null;
}

function deleteFeedback() {
    let id = getSelectedFeedbackId();

    if (!id) {
        alert("Select a feedback first.");
        return;
    }

    if (confirm("Delete selected feedback?")) {
        document.getElementById("deleteId").value = id;
        document.getElementById("deleteForm").submit();
    }
}
</script>

</body>
</html>
