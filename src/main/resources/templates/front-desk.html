<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Front Desk - Hotel De Soleil</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"Segoe UI", Arial, sans-serif;
            background:#f5f5f5;
        }

        /* NAVBAR */

        .navbar{
            width:100%;
            height:85px;
            background:rgba(15,25,40,0.95);
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 70px;
        }

        .logo{
            color:white;
            font-size:34px;
            font-weight:bold;
            letter-spacing:1px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            margin-left:35px;
            font-size:18px;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#d4b36a;
        }

        /* HEADER */

        .hero{
            width:100%;
            padding:60px 10%;
            background-image:
            linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
            url('/images/splash-bg.jpg');

            background-size:cover;
            background-position:center;
            color:white;
            text-align:center;
        }

        .hero h1{
            font-size:65px;
            font-family:Georgia, serif;
            margin-bottom:15px;
        }

        .hero p{
            font-size:22px;
            color:#d4b36a;
        }

        /* DASHBOARD */

        .dashboard{
            padding:60px 8%;
        }

        .status-buttons{
            display:flex;
            gap:20px;
            margin-bottom:40px;
            flex-wrap:wrap;
        }

        .status-btn{
            padding:15px 35px;
            border:none;
            background:#101820;
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
            border-radius:6px;
        }

        .status-btn:hover{
            background:#d4b36a;
        }

        /* TABLE */

        .table-container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
            overflow-x:auto;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#101820;
            color:white;
            padding:16px;
            font-size:16px;
        }

        td{
            padding:15px;
            border-bottom:1px solid #ddd;
            text-align:center;
            font-size:15px;
        }

        tr:hover{
            background:#f7f7f7;
        }

        /* ACTION BUTTONS */

        .action-btn{
            border:none;
            padding:10px 16px;
            margin:3px;
            color:white;
            cursor:pointer;
            border-radius:5px;
            font-size:14px;
            font-weight:bold;
        }

        .confirm-btn{
            background:#27ae60;
        }

        .edit-btn{
            background:#f39c12;
        }

        .cancel-btn{
            background:#c0392b;
        }

        .delete-btn{
            background:black;
        }

        .action-btn:hover{
            opacity:0.85;
        }

        /* STATUS TAGS */

        .pending{
            color:#f39c12;
            font-weight:bold;
        }

        .success{
            color:#27ae60;
            font-weight:bold;
        }

        .cancelled{
            color:#c0392b;
            font-weight:bold;
        }

        @media(max-width:1000px){

            .navbar{
                padding:0 25px;
            }

            .logo{
                font-size:25px;
            }

            .nav-links a{
                margin-left:15px;
                font-size:15px;
            }

            .hero h1{
                font-size:45px;
            }

            .status-buttons{
                flex-direction:column;
            }
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        HOTEL DE SOLEIL
    </div>

    <div class="nav-links">
        <a th:href="@{/#home}">Home</a>
        <a th:href="@{/#about}">About</a>
        <a th:href="@{/#rooms}">Rooms</a>
        <a th:href="@{/#gallery}">Gallery</a>
        <a th:href="@{/#contact}">Contact</a>
    </div>

</div>

<!-- HERO -->

<section class="hero">

    <h1>Front Desk Dashboard</h1>

    <p>
        Manage reservations, payments, and room assignments
    </p>

</section>

<!-- DASHBOARD -->

<section class="dashboard">

    <!-- STATUS BUTTONS -->

    <div class="status-buttons">

    <a class="status-btn" th:href="@{/front-desk(status='PENDING')}">
        Pending Bookings
    </a>

    <a class="status-btn" th:href="@{/front-desk(status='SUCCESSFUL')}">
        Successful Bookings
    </a>

    <a class="status-btn" th:href="@{/front-desk(status='CANCELED')}">
        Canceled Bookings
    </a>

</div>

    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

            <tr>
                <th>Customer</th>
                <th>Room Type</th>
                <th>Guests</th>
                <th>Status</th>
                <th>Room Number</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

<tr th:each="booking : ${bookings}">

    <td th:text="${booking.fullName}"></td>

    <td th:text="${booking.roomType}"></td>

    <td th:text="${booking.guests}"></td>

    <td th:text="${booking.status}"></td>

    <td th:text="${booking.roomNumber != null ? booking.roomNumber : 'Not Assigned'}"></td>

    <td>

        <form th:if="${booking.status == 'PENDING'}"
              th:action="@{/confirm-booking}"
              method="post"
              style="display:inline-block;">

            <input type="hidden" name="id" th:value="${booking.id}">

            <select name="paymentMethod" required>
                <option value="">Payment</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
            </select>

            <select name="roomNumber" required>
                <option value="">Room</option>
                <option value="R101">R101</option>
                <option value="R102">R102</option>
                <option value="R103">R103</option>
                <option value="R104">R104</option>
                <option value="R105">R105</option>
                <option value="R201">R201</option>
                <option value="R202">R202</option>
                <option value="R203">R203</option>
                <option value="R204">R204</option>
                <option value="R205">R205</option>
                <option value="R301">R301</option>
                <option value="R302">R302</option>
                <option value="R303">R303</option>
                <option value="R304">R304</option>
                <option value="R305">R305</option>
            </select>

            <button class="action-btn confirm-btn" type="submit">
                Confirm
            </button>

        </form>

        <form th:if="${booking.status == 'PENDING'}"
              th:action="@{/cancel-booking}"
              method="post"
              style="display:inline-block;">

            <input type="hidden" name="id" th:value="${booking.id}">

            <button class="action-btn cancel-btn" type="submit">
                Cancel
            </button>

        </form>

        <form th:if="${booking.status == 'CANCELED'}"
              th:action="@{/delete-booking}"
              method="post"
              style="display:inline-block;">

            <input type="hidden" name="id" th:value="${booking.id}">

            <button class="action-btn delete-btn" type="submit">
                Delete
            </button>

        </form>

    </td>

</tr>

</tbody>

        </table>

    </div>

</section>

</body>
</html>
